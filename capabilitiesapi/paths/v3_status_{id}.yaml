get:
  summary: Get the status of a job
  description: Return the latest status of a custom capability job that has been executed.
  parameters:
    - name: x-gw-ims-org-id
      in: header
      description: >-
        This is the identifier for Adobe Identity Management Service (IMS) as defined in Adobe's developer console.
        This is optional.
      required: false
      schema:
        type: string
    - name: x-api-key
      in: header
      description: The API key as defined in Adobe's developer console.
      required: true
      schema:
        type: string
    - name: Authorization
      in: header
      description: The authorization token with bearer "token_value".
      required: true
      schema:
        type: string
    - name: id
      in: path
      description: The ID of the job you want to see the status of.
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Status of a capability execution.
      content:
        application/json:
          schema:
            type: object
            oneOf:
              - $ref: ../components/schemas/notstartedEvent.yaml
              - $ref: ../components/schemas/runningEvent.yaml
              - $ref: ../components/schemas/succeededEvent.yaml
              - $ref: ../components/schemas/failedEvent.yaml
      headers:
        retry-after:
          schema:
            type: integer
          description: The number of seconds until the user should try again.
        Content-Type:
          schema:
            type: string
          description: The type of content returned (e.g., `application/json`).
        Content-Length:
          schema:
            type: integer
          description: The length of the response.
