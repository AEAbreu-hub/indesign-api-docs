post:
  summary: Submit a custom capability
  description: >-
    Submit the capability bundle. This returns the URL for posting an execution request
    for the capability.
  parameters:
    - name: x-gw-ims-org-id
      in: header
      description: This is the identifier for Adobe Identity Management Service (IMS) as defined in Adobe's developer console.
      required: true
      schema:
        type: string
    - name: x-api-key
      in: header
      description: The API key as defined in Adobe's developer console.
      required: true
      schema:
        type: string
    - name: Authorization
      in: header
      description: The authorization token with bearer "token_value".
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/zip:
        schema:
          type: object
    description: >-
      The capability bundle, in ZIP format. This package describes the capability to the app
      engine.
    required: true
  responses:
    '202':
      description: Status of a capability execution.
      content:
        application/json:
          schema:
            properties:
              capability:
                type: string
                description: The name of the capabilit, as specified in the capability manifest.
              version:
                type: string
                description: The version of the capability, as specified in the capability manifest.
              url:
                type: string
                description: The URL to submit an execution request for the capability.
    '400':
      $ref: ../components/responses/BadParams.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
