post:
  summary: Submit a capability execution request
  description: >-
    Submit an execution request for a custom capability.
    Define the input assets and parameters the capability will use
    when it is executed against the app engine.
  parameters:
    - name: x-gw-ims-org-id
      in: header
      description: This is the identifier for Adobe Identity Management Service (IMS) as defined in Adobe's developer console.
      required: true
      schema:
        type: string
    - name: x-api-key
      in: header
      description: The API key as defined in Adobe's developer console.
      required: true
      schema:
        type: string
    - name: Authorization
      in: header
      description: The authorization token with bearer "token_value".
      required: true
      schema:
        type: string
    - name: organization
      in: path
      description: >-
        The organization identifier, reported in the response to a capability submit
        request.
      required: true
      schema:
        type: string
    - name: capability
      in: path
      description: The name of the capability, specified in the capability manifest.
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/BaseJobRequestWithOutput.yaml
    description: >-
      This job request object specifies parameters for the execution of the
      capability.
    required: true
  responses:
    '202':
      $ref: ../components/responses/Accepted.yaml
    '400':
      $ref: ../components/responses/BadParams.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
