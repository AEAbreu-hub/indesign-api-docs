allOf:
  - $ref: ./BaseJobRequestWithOutput.yaml
  - description: Inputs for the data merge request.
    type: object
    required:
      - params
    properties:
      params:
        type: object
        required:
          - targetDocument
          - dataSource
        properties:
          targetDocument:
            description: The tagged document to be used as template for merging.
            type: string
          dataSource:
            description: The data source files to be used.
            type: string
          outputMediaType:
            description: The type of required output.
            type: string
            enum:
              - image/jpeg
              - image/png
              - application/pdf
              - application/x-indesign
            default: application/x-indesign
          exportSettings:
            type: object
            description: The settings corresponding to the output format.
            properties:
              jobOptionsFile:
                type: string
                description: >-
                  Only relevant if outputMediaType is "application/pdf". The
                  file, which will be used as PDF creation settings file during
                  the export. This will take precedence over pdfPreset
                  attribute.
              pdfPreset:
                type: string
                description: >-
                  The PDF export style to be used. This is relevant if
                  outputMediaType is "application/pdf".
                default: High Quality Print
                enum:
                  - High Quality Print
                  - PDF/X-1a:2001
                  - PDF/X-3:2002
                  - PDF/X-4:2008
                  - Press Quality
                  - Smallest File Size
              quality:
                type: string
                description: Defines the quality of the output for JPEG and PNG formats.
                default: medium
                enum:
                  - low
                  - medium
                  - high
                  - maximum
              linkImages:
                description: >-
                  Only relevant if outputMediaType is "application/x-indesign".
                  If true, links images to the target document. If false, embeds
                  linked images, already referred in the target document.
                type: boolean
                default: false
          recordRange:
            description: >-
              The ranges of records to process for this job. Value can be 'All'
              along with numeral ranges. For example, '1-2, 5'.
            type: string
          allowMultipleRecordsPerPage:
            description: The number of records to place on each page of the document.
            type: boolean
          multipleRecordLayoutOptions:
            description: >-
              The options to be used in case allowMultipleRecordsPerPage is set
              to true.
            type: object
            properties:
              arrangeBy:
                description: |
                  The order in which to arrange records in the target document.
                  * `rows_first` - Arranges records by row.
                  * `columns_first` - Arranges records by column.
                type: string
                enum:
                  - rows_first
                  - columns_first
              bottomMargin:
                description: >-
                  The offset value of the bottom margin in the target document.
                  The values can be specified like '1 pt', '1 pica'. '1' etc. If
                  a number is mentioned in the string, it will be used as a
                  value in pica.
                type: string
              topMargin:
                description: >-
                  The offset value of the top margin in the target document. The
                  values can be specified like '1 pt', '1 pica'. '1' etc. If a
                  number is mentioned in the string, it will be used as a value
                  in pica.
                type: string
              leftMargin:
                description: >-
                  The offset value of the left margin in the target document.
                  The values can be specified like '1 pt', '1 pica'. '1' etc. If
                  a number is mentioned in the string, it will be used as a
                  value in pica.
                type: string
              rightMargin:
                description: >-
                  The offset value of the right margin in the target document.
                  The values can be specified like '1 pt', '1 pica'. '1' etc. If
                  a number is mentioned in the string, it will be used as a
                  value in pica.
                type: string
              columnSpacing:
                description: >-
                  The amount of spacing between columns of records in the target
                  document. The values can be specified like '1 pt', '1 pica'.
                  '1' etc. If a number is mentioned in the string, it will be
                  used as a value in pica.
                type: string
              rowSpacing:
                description: >-
                  The amount of spacing between rows of records in the target
                  document. The values can be specified like '1 pt', '1 pica'.
                  '1' etc. If a number is mentioned in the string, it will be
                  used as a value in pica.
                type: string
          imagePlacementOptions:
            description: >-
              These are the options for image placement which will be used while
              merging images in the document.
            type: object
            properties:
              centerImage:
                description: >-
                  If true, centers the image in the frame while preserving the
                  frame size as content size and proportions. If the content is
                  larger than the frame, content around the edges is obscured by
                  the bounding box of the frame. This doesn't work with
                  'Content_Aware_Fit' fittingOption.
                type: boolean
              fittingOption:
                description: >
                  Method of fitting content in a frame.

                  * `content_aware_fit` - Selects best crop region of the
                  content for the frame based on Adobe Sensei. Note: Preserves
                  frame size but it might scale the content size. If this
                  fitting is set, centerImage property is turned-off.

                  * `fill_proportional` - Resizes content to fill the frame
                  while preserving the proportions of the content. If the
                  content and frame have different proportions, some of the
                  content is obscured by the bounding box of the frame.

                  * `fit_content_to_frame` - Resizes content to fit the frame.
                  Note: Content that is a different size than the frame appears
                  stretched or squeezed.

                  * `fit_frame_to_content` - Resizes the frame so it fits the
                  content.

                  * `honor_existing_style` - Apply the frame fitting based on
                  existing setting applied on the original frame.

                  * `preserve_sizes` - Preserves the original sizes of the frame
                  and the content. Note: Content that is larger than the frame
                  is obscured around the edges.

                  * `proportional` - Resizes content to fit the frame while
                  preserving content proportions. If the content and frame have
                  different proportions, an empty space occurs in the frame.
                type: string
                enum:
                  - content_aware_fit
                  - fill_proportional
                  - fit_content_to_frame
                  - fit_frame_to_content
                  - honor_existing_style
                  - preserve_sizes
                  - proportional
              linkImages:
                description: >-
                  If true, links images to the target document. If false, embeds
                  images in the target document. This is in reference to the
                  images being brought in the document while merging.
                type: boolean
          pagesPerDocument:
            description: The maximum number of pages per document.
            type: integer
          removeBlankLines:
            description: If true, removes blank lines caused by empty fields.
            type: boolean
            default: false
          convertUrlToHyperlink:
            description: >-
              If true, all urls in the merged document are converted into
              hyperlinks.
            type: boolean
            default: true
          outputFileBaseString:
            type: string
            description: The name of the output file.
          outputFolderPath:
            type: string
            description: The path of the output folder.
