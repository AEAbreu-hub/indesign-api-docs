description: The URL where the output assets are to be posted after the job is processed.
type: object
required:
  - destination
  - source
properties:
  destination:
    type: object
    required:
      - url
    properties:
      url:
        type: string
        description: The URL of the asset.
      storageType:
        type: string
        description: >-
          This is an optional parameter, however IT IS RECOMMENDED to provide this
          information.
        enum:
          - Azure
          - Dropbox
  source:
    type: string
    description: >-
      This provides a path relative of the output where the resource would be
      generated. It cannot go up using '..' or '/'. Should be a valid file name.
