allOf:
  - $ref: ./BaseEvent.yaml
  - description: The job has succeeded.
    type: object
    properties:
      status:
        type: string
        description: The current state of the job.
        enum:
          - succeeded
      data:
        type: object
        description: The output response from the current state of the job.
      dataURL:
        type: string
        description: >-
          The data returned from the execution of the capability. If the data size is between
          250 KB and 20 MB, it will be provided as a pre-signed
          URL. If it is larger than 20 MB, the job will fail.
      outputs:
        type: object
        description: A list of URLs for all the generated assets.
