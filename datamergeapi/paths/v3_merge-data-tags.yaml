post:
  summary: Get data merge tags
  description: >-
    Retrieves the data merge tags from a document.
  operationId: dataMergeTags
  parameters:
    - name: x-gw-ims-org-id
      in: header
      description: >-
        This is the identifier for Adobe Identity Management Service (IMS) as defined in Adobe's developer console.
        This is optional.
      required: false
      schema:
        type: string
    - name: x-api-key
      in: header
      description: The API key as defined in Adobe's developer console.
      required: true
      schema:
        type: string
    - name: Authorization
      in: header
      description: The authorization token with bearer "token_value".
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/MergeDataTagsRequest.yaml
    description: >-
      This job request object specifies parameters for retrieving the data merge
      tags.
    required: true
  responses:
    '202':
      $ref: ../components/responses/Accepted.yaml
    '400':
      $ref: ../components/responses/BadParams.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
