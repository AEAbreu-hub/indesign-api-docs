post:
  tags:
    - dataMerge
  summary: Performs data merge.
  description: >-
    Creates and returns merged InDesign documents or PDFs that are created after
    merging the data and the given template. Output rendition has mimetype
    'image/jpeg' for jpeg, 'image/png' for png, 'application/pdf' for pdf or
    'application/x-indesign' for indd. For the structure of
    StatusCompletedResponse/output/data refer to DataMergeOutputData. Also for
    the list of possible error codes in FailedEvent refer to
    DataMergeFailedData.
  operationId: dataMerge
  parameters:
    - name: x-gw-ims-org-id
      in: header
      description: >-
        Identifier for IMS organization as defined in Adobe's developer console.
        This is optional
      required: false
      schema:
        type: string
    - name: x-api-key
      in: header
      description: API key as defined in Adobe's developer console
      required: true
      schema:
        type: string
    - name: Authorization
      in: header
      description: Authorization token with bearer "token_value"
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/MergeDataRequest.yaml
    description: >-
      Job request object that specifies parameters for merging the data as per
      the given template.
    required: true
  responses:
    '202':
      $ref: ../components/responses/Accepted.yaml
    '400':
      $ref: ../components/responses/BadParams.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
