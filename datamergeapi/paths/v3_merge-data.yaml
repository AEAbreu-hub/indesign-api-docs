post:
  summary: Perform a data merge
  description: >-
    Returns InDesign documents or PDFs that are created by
    merging the data provided and the specified template.<br></br> 
    The data merge output MIME types are:
    <ul> `image/jpeg` for JPEG. </ul>
    <ul> `image/png` for PNG. </ul> 
    <ul> `application/pdf` for PDF. </ul>
    <ul> `application/x-indesign` for INDD. </ul>
  operationId: dataMerge
  parameters:
    - name: x-gw-ims-org-id
      in: header
      description: >-
        This is the identifier for Adobe Identity Management Service (IMS) as defined in Adobe's developer console.
        This is optional.
      required: false
      schema:
        type: string
    - name: x-api-key
      in: header
      description: The API key as defined in Adobe's developer console.
      required: true
      schema:
        type: string
    - name: Authorization
      in: header
      description: The authorization token with bearer "token_value".
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/MergeDataRequest.yaml
    description: >-
      This job request object specifies parameters for merging the data with
      the given template.
    required: true
  responses:
    '202':
      $ref: ../components/responses/Accepted.yaml
    '400':
      $ref: ../components/responses/BadParams.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
