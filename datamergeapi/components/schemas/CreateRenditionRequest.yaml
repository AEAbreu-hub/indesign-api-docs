allOf:
  - $ref: ./BaseJobRequestWithOutput.yaml
  - description: Inputs and properties with which the job should be processed.
    type: object
    required:
      - params
    properties:
      params:
        type: object
        required:
          - targetDocuments
          - outputMediaType
        properties:
          targetDocuments:
            description: >-
              List of documents to render as per the given parameters.
              Currently, only one document is supported.
            type: array
            items:
              type: string
            minItems: 1
            maxItems: 1
          outputMediaType:
            description: The type output rendition to be created.
            type: string
            enum:
              - image/jpeg
              - image/png
              - application/pdf
          exportingSpread:
            type: boolean
            default: false
            description: >-
              Specify true if you consider range as spread numbers, false if you
              treat range as pages.
          pageRange:
            type: string
            default: All
            description: >-
              Page ranges. The ranges are based on index of the page within the
              document. Value can be 'All' along with numeral ranges. Also, if
              exportingSpread is true, this range would represent spread indices
              in the document.
          quality:
            type: string
            description: Defines the quality of the output.
            default: medium
            enum:
              - low
              - medium
              - high
              - maximum
          renderingStyle:
            type: string
            description: Specifies formatting options for the converted JPEG images.
            default: baseline_encoding
            enum:
              - baseline_encoding
              - progressive_encoding
          resolution:
            type: integer
            default: 72
            description: Specifies the resolution of the final image.
            minimum: 1
            maximum: 2400
          colorSpace:
            type: string
            description: Specifies formatting options for converted JPEG images.
            default: rgb
            enum:
              - rgb
              - cmyk (only for jpeg)
              - gray
          embedColorProfile:
            type: boolean
            default: true
            description: Specify true to embed the color profile, false otherwise.
          antiAlias:
            type: boolean
            default: true
            description: >-
              If true, uses the anti-aliasing for text and vectors during
              export.
          simulateOverprint:
            type: boolean
            default: false
            description: >-
              If true, simulates the effects of overprinting spot and processes
              colors in the same way they would occur when you print.
          useDocumentBleeds:
            type: boolean
            default: false
            description: If true, uses the document's bleed settings in the exported JPEG.
          colorSettingsFile:
            type: string
            description: The color settings file to be used for generating a rendition.
          transparentBackground:
            type: boolean
            default: false
            description: >-
              If true, uses a transparent background for the exported PNG. This
              is valid only for PNG rendition.
          createSeparateFiles:
            type: boolean
            default: false
            description: >-
              Specify true for creating separate PDF files for all the specified
              pages/spreads. This is applicable only in case of pdf rendition.
          optimizeForFastWebView:
            type: boolean
            default: true
            description: >-
              Specify true for optimizing the PDF for faster web viewing. This
              is applicable only in case of pdf rendition.
          embedPageThumbnails:
            type: boolean
            default: false
            description: >-
              Specify true for embedding page thumbnails. This is applicable
              only in case of pdf rendition.
          includeBookmarks:
            type: boolean
            default: false
            description: >-
              If true, displays bookmarks and table of contents entries as links
              in the bookmarks pane of the PDF document. If false, bookmarks are
              not exported. This is applicable only in case of pdf rendition.
          includeHyperlinks:
            type: boolean
            default: false
            description: >-
              If true, includes hyperlinks when exporting the document. This is
              applicable only in case of pdf rendition.
          exportNonprintingObjects:
            type: boolean
            default: false
            description: >-
              If true, makes non-printing objects visible in the PDF document.
              This is applicable only in case of pdf rendition.
          exportGuidesAndGrids:
            type: boolean
            default: false
            description: >-
              If true, includes visible guides and baseline grids in the PDF.
              This is applicable only in case of pdf rendition. document.
          createTaggedPDF:
            type: boolean
            default: true
            description: >-
              If true, creates a tagged PDF file. This is applicable only in
              case of pdf rendition.
          includeInteractiveElements:
            type: string
            description: >-
              Specifies the option to draw interactive elements. This is
              applicable only in case of pdf rendition.
            default: do_not_include
            enum:
              - do_not_include
              - appearance_only
          exportWhichLayers:
            type: string
            description: >-
              The layers to be exported. This is applicable only in case of pdf
              rendition.
            default: export_all_layers
            enum:
              - export_all_layers
              - export_visible_layers
              - export_visible_printable_layers
          jobOptionsFile:
            type: string
            description: >-
              The file which will be used as PDF creation settings file during
              the export. This will take precedence over pdfPreset attribute.
              This is applicable only in case of pdf rendition.
          pdfPreset:
            type: string
            description: >-
              The export style to be used. This is applicable only in case of
              pdf rendition.
            default: High Quality Print
            enum:
              - High Quality Print
              - PDF/X-1a:2001
              - PDF/X-3:2002
              - PDF/X-4:2008
              - Press Quality
              - Smallest File Size
          outputFileBaseString:
            type: string
            description: The name of the output file.
          outputFolderPath:
            type: string
            description: The path of the output folder.
