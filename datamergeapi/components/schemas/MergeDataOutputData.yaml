allOf:
  - $ref: ./BaseOutputData.yaml
  - description: The data pertaining to the merged records.
    type: object
    properties:
      records:
        description: The information about the records which were processed.
        type: array
        items:
          type: object
          properties:
            recordIndex:
              type: string
              description: >-
                Indicates the record numbers for which the data is provided
                here.`
            outputs:
              description: The list of outputs corresponding to this record.
              type: array
              items:
                type: object
                properties:
                  pageIndex:
                    type: string
                    description: >-
                      Indicates the page numbers in the merged output for which
                      the paths are mentioned below.
                  path:
                    description: >-
                      The paths corresponding to the pages mentioned in
                      pageIndex.
                    type: array
                    items:
                      type: string
            warnings:
              $ref: ./MergeWarningResponse.yaml
              description: Warnings generated during the merge.
      warnings:
        $ref: ./WarningResponse.yaml
        description: Warnings generated for the template.
