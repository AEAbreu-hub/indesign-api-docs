allOf:
  - $ref: ./BaseOutputData.yaml
  - description: >-
      The data corresponding to the tags from the documents and the data source
      file, if provided.
    type: object
    properties:
      documentTags:
        description: The information about the tags retrieved from the target document.
        type: array
        items:
          type: object
          properties:
            name:
              type: string
              description: Name of the tag.
            type:
              type: string
              description: Type of the tag.
              enum:
                - image
                - text
                - qr
            parentPageItems:
              description: >-
                Information about the page items where the tag is present, if it
                is requested.
              type: array
              items:
                type: object
                properties:
                  pageItemId:
                    type: integer
                    description: >-
                      ID of the page item which has the data merge tag within
                      it.
                  pageIndexInSpread:
                    type: integer
                    description: >-
                      Zero based index of the page (in the spread) on which the
                      page item exists.
                  pageIndexInDocument:
                    type: integer
                    description: >-
                      Zero based index of the page (in the document) on which
                      the page item exists.
                  pageId:
                    type: integer
                    description: ID of the page on which the page item exists.
                  pageName:
                    type: string
                    description: Name of the page on which the page item exists.
                  spreadIndex:
                    type: integer
                    description: >-
                      Zero based index of the spread (in the document) on which
                      the page item exists.
                  spreadId:
                    type: integer
                    description: ID of the spread on which the page item exists.
                  parentStoryId:
                    type: integer
                    description: >-
                      Only valid for text tags. ID of the parent story in which
                      the tag exists.
      dataSourceTags:
        description: >-
          The information about the tags from the data source file and their
          relevance for the target document.
        type: array
        items:
          type: object
          properties:
            name:
              type: string
              description: Name of the tag.
            type:
              type: string
              description: Type of the tag.
              enum:
                - image
                - text
                - qr
            status:
              type: string
              description: >-
                Status or relevance of the tag in context to the target
                document.
              enum:
                - match
                - extra
      dataSourceValidation:
        description: >-
          Provided when both target document and data source are given. This
          will include data from validation of the data source against the
          target document.
        type: object
        properties:
          isValid:
            type: boolean
            description: >-
              Indicates whether the provided data source is valid for the
              document.
          missingTags:
            description: >-
              Provides the information about the tags which are missing from the
              data source but are required by the document.
            type: array
            items:
              type: string
      warnings:
        $ref: ./WarningResponse.yaml
        description: Warnings generated during the execution of the request.
