description: The base job request for any job.
required:
  - assets
properties:
  assets:
    type: array
    items:
      $ref: ./InputAsset.yaml
    description: Information about the assets, which will be used to process the job.
  params:
    type: object
    properties:
      generalSettings:
        description: General settings.
        type: object
        properties:
          fonts:
            description: Settings related to fonts.
            type: object
            properties:
              fontsDirectories:
                description: >-
                  This lists the font directories for
                  the input InDesign documents. "Document Fonts" in parallel to
                  the document will continue to work even without specifying them. 
                  <br></br>
                  If none are specified, a temporary base directory (working directory)
                  will be considered as a font directory.
                type: array
                items:
                  type: string
                  description: >-
                    This provides a path to a directory relative to a temporary
                    base directory (working directory) where the fonts can be
                    found. It cannot go up using '..' or '/'. Should be a valid
                    path. For specifying a working directory, mention '.'.
          links:
            description: Settings related to links.
            type: object
            properties:
              replaceLinks:
                type: array
                items:
                  type: object
                  required:
                    - targetDocument
                    - mapping
                  properties:
                    targetDocument:
                      description: The document in which the relinking is to be done.
                      type: string
                    mapping:
                      type: array
                      items:
                        type: object
                        required:
                          - newAssetRelativePath
                        properties:
                          currentURI:
                            type: string
                            description: >-
                              The existing URI of the link that needs relinking.
                              If multiple links with this URI are found, all
                              will be relinked. If `linkID is provided, this
                              attribute will be ignored. Either
                              `currentURI` or `linkID` should be present.
                          linkID:
                            type: integer
                            description: >-
                              The ID of the link which is to be relinked. If
                              `currentURI` is also provided, it will be ignored.
                              Either `currentURI` or `linkID` should be
                              present.
                          newAssetRelativePath:
                            type: string
                            description: >-
                              This provides a path relative to a temporary base
                              directory (working directory) where the asset to
                              be linked to can be found. It cannot go up using
                              '..' or '/'. Should be a valid file name.
          appLogs:
            description: Describes parameters regarding application logs.
            type: object
            properties:
              logsRelativePath:
                type: string
                description: >-
                  This provides a path to a file, relative to the temporary base
                  directory (working directory). This file is where the
                  application's logs are to be dumped.
