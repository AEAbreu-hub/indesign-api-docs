allOf:
  - $ref: ./BaseJobRequest.yaml
  - description: >-
      Filters according to which the information related to data merge tags
      would be retrieved.
    type: object
    required:
      - params
    properties:
      params:
        type: object
        required:
          - targetDocument
        properties:
          targetDocument:
            description: The target document that will have its tags extracted.
            type: string
          dataSource:
            description: >-
              The data source file to be used for extracting and matching the
              tags.
            type: string
          filter:
            description: >-
              The filter applied for tags. Accepts multiple values.
            type: array
            example: text, image
            default: all
            items:
              type: string
              enum: [all, text, image, qr]
          includePageItemIdentifiers:
            type: boolean
            description: >-
              If true, the information for associated page items is added to the
              tags extracted from the document.
            default: false
