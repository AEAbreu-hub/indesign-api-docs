allOf:
  - type: object
    description: Error codes from capabilities and their definitions.
    properties:
      runtime_error:
        type: string
        description: |
          - Runtime error: Unable to connect to server for communication.
          - Runtime error: Error parsing the response from application.
          - Runtime script error. This should not had happened.
          - Runtime error: Error during processing.
          - Runtime error: Unable to create specified output directory.
          - PreJob runtime script error. This should not had happened.
          - PreJob runtime error: Error during processing.
          - PreJob runtime error: Unable to create specified output directory.
          - Application error: Script execution failed.
          - Error during processing.
      capability_error:
        type: string
        description: >
          - Capability error: No PDF Preset could be set.

          - Capability error: Unable to relink. Relink failed for
          'parameterName'.

          - Capability error: Unable to place. Place failed for 'parameterName'.

          - Capability error: Cannot open file.
      validation_error:
        type: string
        description: >
          - Validation error: Expected array for property 'parameterName'.

          - Validation error: Expected boolean 'parameterName' is the provided
          value for property 'parameterName'.

          - Validation error: Expected integer 'parameterName' is the provided
          value for property 'parameterName'.

          - Validation error: Expected number 'parameterName' is the provided
          value for property 'parameterName'.

          - Validation error: Expected string 'parameterName' is the provided
          value for property 'parameterName'.

          - Validation error: Incorrect range provided. Culprit Value is
          'parameterName'.

          - Validation error: Key not found in object. Missing key is
          'parameterName'.

          - Validation error: No matching enum value found. 'parameterName' is
          the provided value for property 'parameterName'.

          - Validation error: Empty filter provided for extraction of tags.

          - Validation error: Empty data source found.

          - Validation error: Relative path not acceptable. Path provided is
          'parameterName'

          - Validation error: Mismatch in jobType. Provided value is
          'parameterName'

          - Validation error: Either the params is not found in the request or
          it is not in the correct format.

          - Validation error: Required parameters are missing. Please check
          'parameterName'

          - Validation error: The link URI was not found. Provided link URI is
          'parameterName'.

          - Validation error: Expected object for property 'parameterName'.

          - Validation error: At least one of the parameters should be present.
          Missing parameters are 'parameterName'

          - Validation error: Unable to send the script to the server. Please
          check the path of the script.

          - Validation error: The link id was not found. Provided link id is
          'parameterName'.

          - Validation error: Unable to send the script to the server. Please
          check the path of the script.

          - Validation error: Relative path not acceptable. 'parameterName' is
          the provided value for property 'parameterName'.

          - PreJob validation error: Expected array for property
          'parameterName'.

          - PreJob validation error: Expected boolean 'parameterName' is the
          provided value for property 'parameterName'.

          - PreJob validation error: Expected integer 'parameterName' is the
          provided value for property 'parameterName'.

          - PreJob validation error: Expected number 'parameterName' is the
          provided value for property 'parameterName'.

          - PreJob validation error: Expected string 'parameterName' is the
          provided value for property 'parameterName'.

          - PreJob validation error: Incorrect range provided. Culprit Value is
          'parameterName'.

          - PreJob validation error: Key not found in object. Missing key is
          'parameterName'.

          - PreJob validation error: No matching enum value found.
          'parameterName' is the provided value for property 'parameterName'.

          - PreJob validation error: Relative path not acceptable. Path provided
          is 'parameterName'  
      application_error:
        type: string
        description: |
          - Application error: Script execution failed.
          - Error during processing.
      resource_not_found:
        type: string
        description: |
          - Error in resolving asset
          - Job id not found
      invalid_parameters:
        type: string
        description: |
          - invalid capability bundle
          - invalid extension
          - invalid storage type
          - invalid request parameters
      access_error:
        type: string
        description: |
          - api-key not allowed
          - capability not found
          - user does not have access to the resource
          - private capability
      unauthorised_error:
        type: string
        description: |
          - Application error: Script execution failed.
          - Error during processing.
      unsupported_method:
        type: string
        description: >
          - HTTP method used in the request is not allowed for the requested
          resource
      request_not_acceptable:
        type: string
        description: >
          - the server cannot produce a response that matches any of the
          acceptable media types specified in the Accept header.
      invalid_content_type:
        type: string
        description: |
          - Payload is in unsupported format
      service_unavailable:
        type: string
        description: |
          - Error while getting organization for user
      timeout_error:
        type: string
        description: |
          - Job execution exceeded timeout
          - Job timeout occurred
