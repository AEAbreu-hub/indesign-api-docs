post:
  summary: Create JPEG, PNG, or PDF renditions
  description: >-
    The Rendition API creates JPEG, PNG, or PDF renditions of a specific InDesign
    document. <br></br>
    The rendition output MIME types are: 
    <ul> `image/jpeg` for JPEG. </ul> 
    <ul> `image/png` for PNG. </ul>
    <ul> `application/pdf` for PDF. </ul>
  operationId: renditionJob
  parameters:
    - name: x-gw-ims-org-id
      in: header
      description: >-
        This is the identifier for Adobe Identity Management Service (IMS) as defined in Adobe's developer console.
        This is optional.
      required: false
      schema:
        type: string
    - name: x-api-key
      in: header
      description: The API key as defined in Adobe's developer console.
      required: true
      schema:
        type: string
    - name: Authorization
      in: header
      description: The authorization token with bearer "token_value".
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateRenditionRequest.yaml
    description: >-
      This object specifies parameters for the JPEG,
      PNG or PDF output.
    required: true
  responses:
    '202':
      $ref: ../components/responses/Accepted.yaml
    '400':
      $ref: ../components/responses/BadParams.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
