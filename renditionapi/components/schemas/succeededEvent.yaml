allOf:
  - $ref: ./BaseEvent.yaml
  - description: Job is succeeded.
    type: object
    properties:
      status:
        type: string
        description: The current state of the job.
        enum:
          - succeeded
      data:
        type: object
        description: Output response from  current state of the job.
      dataURL:
        type: string
        description: >-
          The data returned from execution of capability. If the data is more
          than 250 kB and less the 20 MB, it will be provided as a presigned
          URL. If it is more than 20 MB, the job will fail.
      outputs:
        type: object
        description: This contains a list of URLs for all the generated assets.
